project:
  type: website
  output-dir: _site
  resources:
    - assets/site.js
    - assets/fonts/*.woff2
    - assets/fonts/COPYRIGHTS
    - _headers
    - coi-serviceworker.js

website:
  title: "Excuse my R"
  description: "R behaviours that surprise even seasoned users, to run in your browser."
  favicon: assets/favicon.svg
  # Menu de gauche à la Read the Docs (assets/before-body.html, rempli par assets/site.js) :
  # la recherche plein texte de Quarto s'y loge, à la place de la barre de navigation
  search:
    location: sidebar
    type: textbox
  page-footer:
    left: "[A ThinkR and Institut Pasteur (safer-r) project.]{.seulement-en}[Un projet ThinkR et Institut Pasteur (safer-r).]{.seulement-fr}"
    right: "[Code runs in your browser thanks to [webR](https://docs.r-wasm.org/webr/).]{.seulement-en}[Le code s'exécute dans votre navigateur grâce à [webR](https://docs.r-wasm.org/webr/).]{.seulement-fr}"

lang: en

# Libellés des fiches, traduits dans fr/_metadata.yml
libelles:
  catalogue: "Catalogue"
  gravite: "Severity"
  reference: "Reference"
  versions: "Affected versions"
  source: "Spotted by"
  attendu: "You would expect"
  accueil: "Home"
  fil: "Breadcrumbs"

language:
  search-text-placeholder: "Search the site"

format:
  html:
    theme: [cosmo, assets/theme.scss]
    css: assets/site.css
    page-layout: custom
    template-partials:
      - assets/title-block.html
      - assets/metadata.html
    include-in-header: assets/head.html
    include-before-body: assets/before-body.html
    include-after-body: assets/after-body.html
    html-math-method: plain
    highlight-style: a11y
    code-copy: false
    anchor-sections: false
    smooth-scroll: false

execute:
  freeze: false
  error: true
  warning: true

knitr:
  opts_chunk:
    comment: ""
    collapse: false
